# Read the Docs configuration file.
# Local development and GitHub Actions use uv; Read the Docs uses this
# requirements.txt fallback because its native build image is pip-based.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - requirements: requirements.txt
