site_name: AI Notes # 您的網站名稱，可自行修改
site_url:  https://chioujryu.github.io/ai-notes-mkdocs/
repo_url: https://github.com/chioujryu/my-mkdocs-AI-docs/tree/main # 仓库地址
repo_name: ai-notes-mkdocs # 仓库名称
# edit_uri: blob/main/docs/ # 编辑路径
# site_description: # 站点描述
# site_author: # 作者
# copyright: # 版权声明

# 使用 Material for MkDocs 主題
theme:
    name: material
    highlightjs: true
    hljs_languages:
        - yaml
        - rust
    analytics:
        gtag: G-ABC123
    include_homepage_in_sidebar: True  # 在侧边栏菜单中列出主页。
    prev_next_buttons_location: both # 设置 “Next” 和 “Previous” 按钮的位置：bottom, top, both , or none
    navigation_depth: 4 # 侧边栏导航标题最大层级，默认4
    collapse_navigation: True # 只在当前页面的侧边栏中包含页面标题。
    titles_only: False # 只在侧边栏中包括文章标题，不包括所有子标题。默认值:False。
    sticky_navigation: True #侧边栏在滚动页面时随主页内容滚动
    locale: zh_CN # 语言配置，需要安装mkdocs[i18n]：pip install mkdocs[i18n]

# theme:
#   name: material


# 配置擴展功能
markdown_extensions:
  - toc:
      toc_depth: 4
  # 1. 數學公式支持 (核心!)
  - pymdownx.arithmatex:
      generic: true

  # 2. 語法高亮
  - pymdownx.highlight
  # 3. 支持任務列表、刪除線、上標、下標等
  - pymdownx.superfences
  - pymdownx.tasklist
  - pymdownx.tilde
  - admonition
  - pymdownx.details

# 可選：配置 MathJax 渲染引擎 (用於渲染 LaTeX)
extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js # 這會載入數學公式載入比較久

