<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">LocateAnything six-step inference data flow</title>
  <desc id="desc">An image and text query pass through six numbered steps: input preparation, Moon-ViT visual encoding, MLP projection and query context, Qwen2.5 parallel box decoding, Hybrid validation with local NTP fallback, and conversion from normalized coordinates to a pixel bounding box.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f3ff"/><stop offset="1" stop-color="#edf8ff"/></linearGradient>
    <linearGradient id="pbd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6757cb"/><stop offset="1" stop-color="#3f86ca"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#27304f" flood-opacity="0.15"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#52617a"/></marker>
    <style>
      .panel{fill:#fff;stroke:#a7b3c4;stroke-width:2;filter:url(#shadow)} .accent{fill:#f3f2ff;stroke:#7772d4;stroke-width:2.3;filter:url(#shadow)}
      .title{font:700 29px Arial,"Noto Sans TC",sans-serif;fill:#2f3150}.step{font:700 18px Arial,"Noto Sans TC",sans-serif;fill:#26334a}.body{font:15px Arial,"Noto Sans TC",sans-serif;fill:#4b596d}.small{font:13px Arial,"Noto Sans TC",sans-serif;fill:#657186}
      .arrow{fill:none;stroke:#52617a;stroke-width:3;marker-end:url(#arrow)}.fallback{fill:none;stroke:#c15c68;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#arrow)}
      .badge{fill:#6358c8}.badgeText{font:700 16px Arial,"Noto Sans TC",sans-serif;fill:#fff;text-anchor:middle}
    </style>
  </defs>
  <rect x="8" y="8" width="1584" height="704" rx="28" fill="url(#bg)" stroke="#d9ddef" stroke-width="2"/>
  <text x="800" y="49" text-anchor="middle" class="title">LocateAnything：從 Screenshot 到 Pixel Box 的六個步驟</text>
  <text x="800" y="76" text-anchor="middle" class="small">同一個 Box Block 的 6 個 tokens 平行預測；不同 blocks 之間維持 causal order</text>

  <rect x="42" y="122" width="226" height="205" rx="18" class="panel"/>
  <circle cx="69" cy="149" r="19" class="badge"/><text x="69" y="155" class="badgeText">1</text><text x="98" y="154" class="step">影像與文字 Query</text>
  <rect x="68" y="183" width="75" height="64" rx="8" fill="#eef1f7" stroke="#8391a7"/><rect x="82" y="195" width="47" height="38" rx="5" fill="#e95d69"/><text x="105" y="219" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#fff">CLICK</text>
  <text x="157" y="200" class="body">1000 × 600</text><text x="157" y="225" class="small">4 toy regions</text>
  <rect x="66" y="270" width="176" height="31" rx="15" fill="#fff0f2" stroke="#e58c96"/><text x="154" y="291" text-anchor="middle" class="body">"the red button"</text>

  <path d="M268 225 H312" class="arrow"/>
  <rect x="315" y="137" width="224" height="175" rx="18" class="accent"/>
  <circle cx="342" cy="164" r="19" class="badge"/><text x="342" y="170" class="badgeText">2</text><text x="371" y="169" class="step">Moon-ViT Visual Tokens</text>
  <text x="340" y="210" class="body">Native-resolution encoder</text><text x="340" y="239" class="body">Image regions → Z</text><text x="340" y="270" class="small">Toy Z：shape (4, 3)</text>

  <path d="M539 225 H583" class="arrow"/>
  <rect x="586" y="122" width="275" height="205" rx="18" class="accent"/>
  <circle cx="613" cy="149" r="19" class="badge"/><text x="613" y="155" class="badgeText">3</text><text x="642" y="154" class="step">MLP Projector 與 Query Context</text>
  <text x="611" y="198" class="body">Z · Wproj → V</text><text x="611" y="227" class="body">V ⊕ Q → shared context C</text><text x="611" y="260" class="small">V：shape (4, 2)</text><text x="611" y="284" class="small">C：shape (7, 2)</text>

  <path d="M861 225 H905" class="arrow"/>
  <rect x="908" y="105" width="638" height="239" rx="20" fill="url(#pbd)" filter="url(#shadow)"/>
  <circle cx="938" cy="136" r="19" fill="#fff"/><text x="938" y="142" font-family="Arial" font-size="16" font-weight="700" fill="#5d56c5" text-anchor="middle">4</text>
  <text x="969" y="142" font-family="Arial,'Noto Sans TC',sans-serif" font-size="20" font-weight="700" fill="#fff">Qwen2.5 + Parallel Box Decoding</text>
  <text x="1227" y="175" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif" font-size="14" fill="#e9edff">C + Bin → Lbox → Pbox = Softmax(Lbox)，shape (6, 10) → simultaneous argmax</text>
  <g font-family="Arial" font-size="13" text-anchor="middle"><rect x="955" y="214" width="79" height="51" rx="8" fill="#fff"/><text x="994" y="245" fill="#3a4270">&lt;box&gt;</text><rect x="1042" y="214" width="79" height="51" rx="8" fill="#fff"/><text x="1081" y="245" fill="#3a4270">120</text><rect x="1129" y="214" width="79" height="51" rx="8" fill="#fff"/><text x="1168" y="245" fill="#3a4270">200</text><rect x="1216" y="214" width="79" height="51" rx="8" fill="#fff"/><text x="1255" y="245" fill="#3a4270">420</text><rect x="1303" y="214" width="79" height="51" rx="8" fill="#fff"/><text x="1342" y="245" fill="#3a4270">650</text><rect x="1390" y="214" width="111" height="51" rx="8" fill="#fff"/><text x="1445" y="245" fill="#3a4270">&lt;/box&gt;</text></g>
  <text x="1227" y="307" text-anchor="middle" font-family="Arial,'Noto Sans TC',sans-serif" font-size="14" fill="#e9edff">一個 Box Block = 一個 decoding step</text>

  <path d="M1227 344 V390" class="arrow"/>
  <rect x="866" y="393" width="418" height="177" rx="18" class="panel"/>
  <circle cx="893" cy="420" r="19" class="badge"/><text x="893" y="426" class="badgeText">5</text><text x="922" y="425" class="step">Hybrid Validation 與局部 NTP Fallback</text>
  <text x="891" y="465" class="body">Format integrity + spatial confidence</text><text x="891" y="494" class="body">可靠：commit tokens 到 KV cache</text><text x="891" y="523" class="body">不可靠：丟棄 block，從 verified prefix 用 NTP 重解</text><text x="891" y="550" class="small">p(top-1) &lt; 0.7 且 top-5 span &gt; 80 → ambiguity</text>

  <path d="M1284 482 H1328" class="arrow"/>
  <rect x="1331" y="393" width="215" height="177" rx="18" fill="#e9f7ef" stroke="#63a57d" stroke-width="2.3" filter="url(#shadow)"/>
  <circle cx="1358" cy="420" r="19" fill="#3f8c62"/><text x="1358" y="426" class="badgeText">6</text><text x="1387" y="417" class="step">[0,1000] 座標還原成</text><text x="1387" y="441" class="step">Pixel Box</text>
  <text x="1356" y="472" class="body">Bnorm：shape (1, 4)</text><text x="1356" y="499" class="body">x × W / 1000</text><text x="1356" y="526" class="body">y × H / 1000</text><text x="1356" y="553" class="small">Bpixel = [120,120,420,390]</text>

  <path d="M870 506 H806 V315 H908" class="fallback"/><text x="765" y="416" class="small" fill="#a33f4b">只重做有問題的 block</text>
  <rect x="66" y="614" width="1480" height="54" rx="14" fill="#fff" stroke="#c4cedb" stroke-width="1.5"/>
  <text x="806" y="638" text-anchor="middle" class="body">Fast = 全程 MTP；Slow = 全程 NTP；Hybrid = MTP 為主、遇到格式或空間歧義才局部回退。</text>
  <text x="806" y="659" text-anchor="middle" class="small">正文使用同一組 Step 1–6 名稱、shape 與數值。</text>
</svg>
